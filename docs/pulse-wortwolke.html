<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — Live-Wortwolke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   PULSE · Wortwolken-Fragetyp (§4.7 „Wörter") — Beamer-Live-Ansicht
   Chrome = Nextcloud-Tokens (Light+Dark) aus Stufe 1.
   Wort-Palette = bewusst GETRENNT vom UI-Akzent (kategorial, je Wort
   stabil, theme-unabhängig hell/dunkel-Varianten).
   Engine = framework-frei, exakt nach Integrationsbeschreibung.
   ═══════════════════════════════════════════════════════════════════ */

/* ---- NC-Theme LIGHT ---- */
:root, [data-theme="light"]{
  --nc-main-bg:#ffffff; --nc-main-text:#1a1a1a; --nc-maxcontrast:#6b6b6b;
  --nc-bg-hover:#f2f2f2; --nc-bg-dark:#ededed; --nc-border:#dcdcdc; --nc-border-dark:#c4c4c4;
  --nc-primary:#0069c2; --nc-primary-el:#006aa3; --nc-primary-hover:#00538a;
  --nc-primary-light:rgba(0,105,194,.12); --nc-on-primary:#fff;
  --nc-success:#2d7d46; --nc-success-light:rgba(45,125,70,.14);
  --nc-error:#c13030; --nc-error-light:rgba(193,48,48,.13);
  /* Atmosphäre (Menti-Look: sanfter Verlauf, ruhige Mitte) */
  --stage-grad: radial-gradient(120% 90% at 50% -10%, #eaf3fd 0%, #f6f8fb 42%, #eef1f6 100%);
  --qr-card:#ffffff;
  /* Wort-Palette LIGHT */
  --w1:#E23744; --w2:#E86B12; --w3:#C08400; --w4:#0E9E90;
  --w5:#2D6FE0; --w6:#7C4DD6; --w7:#D6409A; --w8:#1BA25A;
}
/* ---- NC-Theme DARK ---- */
[data-theme="dark"]{
  --nc-main-bg:#171717; --nc-main-text:#ededed; --nc-maxcontrast:#a0a0a0;
  --nc-bg-hover:#262626; --nc-bg-dark:#242424; --nc-border:#333; --nc-border-dark:#454545;
  --nc-primary:#3ba1f0; --nc-primary-el:#3ba1f0; --nc-primary-hover:#64b6f5;
  --nc-primary-light:rgba(59,161,240,.18); --nc-on-primary:#06243a;
  --nc-success:#57c06f; --nc-success-light:rgba(87,192,111,.20);
  --nc-error:#e56b6b; --nc-error-light:rgba(229,107,107,.20);
  --stage-grad: radial-gradient(120% 95% at 50% -10%, #10233c 0%, #0d1626 45%, #0a0f18 100%);
  --qr-card:#ffffff;
  /* Wort-Palette DARK (hellere Varianten) */
  --w1:#FF6B77; --w2:#FFA24D; --w3:#F4C24A; --w4:#31CEB4;
  --w5:#5B96FF; --w6:#B48CFF; --w7:#FF74B4; --w8:#4CD888;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--nc-main-text); background:var(--nc-main-bg);
  display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}

/* NC-Topbar */
.topbar{background:var(--nc-primary); color:#fff; height:48px; display:flex; align-items:center; gap:10px; padding:0 18px; flex:0 0 auto;}
.topbar .rings{display:flex; gap:3px;}
.topbar .rings i{width:12px;height:12px;border:2.5px solid #fff;border-radius:50%;}
.topbar b{font-weight:700; letter-spacing:.01em;}
.topbar .pulseword{margin-left:6px; font-size:13px; opacity:.85; letter-spacing:.16em; text-transform:uppercase;}
.topbar .spacer{flex:1;}
.topbar button{font:inherit;}

.iconbtn{
  display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px; cursor:pointer;
  border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.10);
  color:#fff; font-size:13px; font-weight:600;
}
.iconbtn:hover{background:rgba(255,255,255,.20);}
.iconbtn.on{background:#fff; color:var(--nc-primary); border-color:#fff;}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* Bühne (Beamer) */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--stage-grad); transition:background .25s;}
.stage-head{display:flex; align-items:flex-start; gap:24px; padding:clamp(16px,2.4vw,34px) clamp(20px,3vw,48px) 0;}
.eyebrow{font-size:clamp(11px,1vw,14px); letter-spacing:.2em; text-transform:uppercase; color:var(--nc-primary-el); font-weight:700;}
.q{font-family:'Poppins',sans-serif; font-weight:700; line-height:1.05; letter-spacing:-.01em;
   font-size:clamp(26px,3.6vw,60px); margin:.18em 0 0; max-width:20ch;}
.q .accent{color:var(--nc-primary-el);}
.head-right{margin-left:auto; text-align:center; flex:0 0 auto;}
.qr-card{background:var(--qr-card); border:3px solid var(--nc-border-dark); border-radius:16px; padding:10px; box-shadow:0 6px 22px rgba(0,0,0,.18);}
.qr-card canvas{display:block; width:clamp(78px,7vw,128px); height:clamp(78px,7vw,128px); image-rendering:pixelated; border-radius:4px;}
.pin{font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.14em; font-size:clamp(15px,1.5vw,24px); margin-top:9px;}
.pin small{display:block; font-family:inherit; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:10px; color:var(--nc-maxcontrast); margin-bottom:2px;}

.chip{display:inline-flex; align-items:center; gap:7px; font-size:clamp(11px,1vw,14px); font-weight:600; line-height:1;
  padding:6px 12px; border-radius:999px; background:var(--nc-success-light); color:var(--nc-success);}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor; animation:pd 1.6s ease-in-out infinite;}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* Wolken-Container */
.cloud-wrap{position:relative; flex:1; min-height:220px; margin:clamp(8px,1.4vw,20px) clamp(12px,2vw,32px);}
#cloud{position:absolute; inset:0; overflow:hidden;}
.word{
  position:absolute; font-family:'Poppins',system-ui,sans-serif; font-weight:700;
  line-height:1; white-space:nowrap; user-select:none;
  transform:translate(-50%,-50%) scale(1); transform-origin:center;
  transition:left .8s cubic-bezier(.22,1,.36,1), top .8s cubic-bezier(.22,1,.36,1),
             font-size .55s cubic-bezier(.22,1,.36,1), opacity .5s ease, transform .5s ease;
  will-change:left,top,transform;
}
.word.entering{opacity:0; transform:translate(-50%,-50%) scale(.35);}
.word .cnt{font-size:.42em; font-weight:600; opacity:.55; margin-left:.28em; vertical-align:.22em;}

.empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:var(--nc-maxcontrast);}
.empty[hidden]{display:none;}   /* hidden-Attribut muss das display:flex schlagen */
.overflow-chip{position:absolute; right:12px; bottom:10px; font-size:13px; font-weight:600; color:var(--nc-maxcontrast);
  background:var(--nc-bg-dark); border:1px solid var(--nc-border); border-radius:999px; padding:4px 12px; pointer-events:none;}
.empty svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.6;}
.empty b{color:var(--nc-main-text); font-size:clamp(18px,2vw,26px); font-family:'Poppins',sans-serif;}
.empty span{font-size:clamp(13px,1.2vw,16px); max-width:32ch;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* Footer: Zähler + Demo-Steuerung + Eingabe (prototyp-spezifisch) */
.footbar{flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px clamp(16px,2.4vw,40px); border-top:1px solid var(--nc-border); background:var(--nc-main-bg);}
.stat{display:flex; align-items:baseline; gap:7px;}
.stat b{font-family:'Poppins',sans-serif; font-size:clamp(18px,1.8vw,26px); font-variant-numeric:tabular-nums;}
.stat span{font-size:12px; color:var(--nc-maxcontrast); text-transform:uppercase; letter-spacing:.08em;}
.foot-spacer{flex:1;}

.wform{display:flex; align-items:center; gap:8px;}
.wform input{
  font:inherit; font-size:16px; height:44px; padding:0 16px; border-radius:999px;
  border:1.5px solid var(--nc-border-dark); background:var(--nc-main-bg); color:var(--nc-main-text);
  width:min(260px,44vw);
}
.wform input:focus-visible{outline:2px solid var(--nc-primary-el); outline-offset:1px; border-color:var(--nc-primary-el);}
.wform input::placeholder{color:var(--nc-maxcontrast);}
.btn{font:inherit; font-weight:600; font-size:15px; min-height:44px; padding:0 18px; border-radius:999px; cursor:pointer;
  border:1px solid transparent; display:inline-flex; align-items:center; gap:8px;}
.btn:focus-visible{outline:2px solid var(--nc-primary-el); outline-offset:2px;}
.btn.primary{background:var(--nc-primary-el); color:var(--nc-on-primary);}
.btn.primary:hover{background:var(--nc-primary-hover);}
.btn.secondary{background:transparent; color:var(--nc-main-text); border-color:var(--nc-border-dark);}
.btn.secondary:hover{background:var(--nc-bg-hover);}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.demo-flag{font-size:11px; color:var(--nc-maxcontrast); border:1px dashed var(--nc-border-dark); border-radius:6px; padding:3px 8px;}

@media (max-width:720px){
  .head-right{display:none;}
  .footbar{gap:10px;}
  .wform input{width:min(200px,52vw);}
}
@media (prefers-reduced-motion:reduce){
  .word{transition:left .3s linear, top .3s linear, font-size .2s linear, opacity .3s ease;}
  .word.entering{transform:translate(-50%,-50%) scale(1);}
  .chip .dot{animation:none;}
}
</style>
</head>
<body data-od-id="wortwolke-app">

<div class="topbar" data-od-id="topbar">
  <span class="rings"><i></i><i></i><i></i></span><b>Nextcloud</b>
  <span class="pulseword">Pulse</span>
  <span class="spacer"></span>
  <button class="iconbtn on" id="liveBtn" data-od-id="live-toggle" aria-pressed="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0"/><path d="M2 12a10 10 0 0 1 20 0"/></svg>
    <span id="liveLabel">Live</span>
  </button>
  <button class="iconbtn" id="resetBtn" data-od-id="reset">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg> Zurücksetzen
  </button>
  <button class="iconbtn" id="themeBtn" data-od-id="theme-toggle">◐ Dark</button>
</div>

<main class="stage" data-od-id="beamer-stage">
  <div class="stage-head">
    <div>
      <div class="eyebrow">Wortwolke · Live</div>
      <h1 class="q">Was verbindest&nbsp;Du mit <span class="accent">Erinnerung</span>?</h1>
      <div style="margin-top:14px"><span class="chip"><span class="dot"></span> Läuft</span></div>
    </div>
    <div class="head-right">
      <div class="qr-card"><canvas id="qr" width="29" height="29" aria-hidden="true"></canvas></div>
      <div class="pin"><small>Code auf …/pulse/join</small>V96&nbsp;LB3</div>
    </div>
  </div>

  <div class="cloud-wrap" data-od-id="cloud-wrap">
    <div id="cloud" role="img" aria-label="Live-Wortwolke der Antworten"></div>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24"><path d="M8 3v4M16 3v4M4 8h16M6 8v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/></svg>
      <b>Noch keine Antworten</b>
      <span>Scanne den Code oder öffne <b>…/pulse/join</b> mit <b>V96 LB3</b> und tippe dein Wort ein.</span>
    </div>
  </div>
  <div class="sr-only" id="srlist" aria-live="polite"></div>
</main>

<div class="footbar" data-od-id="footbar">
  <div class="stat"><b id="cWords">0</b><span>Wörter</span></div>
  <div class="stat"><b id="cPeople">0</b><span>dabei</span></div>
  <div class="stat"><b id="cVotes">0</b><span>Nennungen</span></div>
  <span class="foot-spacer"></span>
  <span class="demo-flag" title="Ersetzt bei der Integration die echte Datenquelle">Demo-Eingabe</span>
  <form class="wform" id="wform" data-od-id="word-input">
    <input id="wtext" type="text" maxlength="24" autocomplete="off" placeholder="Dein Wort …" aria-label="Wort eingeben">
    <button class="btn primary" type="submit">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      Absenden
    </button>
  </form>
</div>

<script>
/* ══════════════════ WORTWOLKE-ENGINE (framework-frei) ══════════════════ */
const PALETTE_VARS = ['--w1','--w2','--w3','--w4','--w5','--w6','--w7','--w8'];
const GAP = 9;         // Mindestabstand zwischen Wort-Boxen (px)
const MARGIN = 10;     // Sicherheitsrand zum Container (px)
const MAX_VISIBLE = 90; // harte Obergrenze sichtbarer Wörter — Rest als "+N weitere"

const cloud = document.getElementById('cloud');
const empty = document.getElementById('empty');
const words = new Map();               // Map<Anzeigewort, Häufigkeit>
const els   = new Map();               // Map<Anzeigewort, HTMLElement>
const measurer = document.createElement('canvas').getContext('2d');

/* --- reine Funktionen: über den Lebenszyklus eines Worts konstant --- */
function norm(s){ return String(s).replace(/\s+/g,' ').trim(); }
function key(s){ return norm(s).toLocaleLowerCase('de'); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function colorFor(word){
  const v = PALETTE_VARS[hashStr('c'+key(word)) % PALETTE_VARS.length];
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}
function vertOf(word){ return (hashStr('v'+key(word)) % 100) < 28; }   // ~28% vertikal, stabil
function baseT(vert, s){ return 'translate(-50%,-50%) rotate('+(vert?90:0)+'deg) scale('+s+')'; }

function sizeScale(){
  const w = cloud.clientWidth || 800;
  const MAXS = Math.max(40, Math.min(112, w/10));
  const MINS = Math.max(15, Math.min(30, MAXS*0.27));
  return { MINS, MAXS };
}

/* --- kollisionsfreie Spiral-Platzierung ---
   `shrink` skaliert die Größenspanne global herunter (Fit-Schleife).
   Rückgabe: { layout, placed, attempted, hidden } */
function computeLayout(shrink){
  const W = cloud.clientWidth, H = cloud.clientHeight;
  const res = { layout:new Map(), placed:0, attempted:0, hidden:0 };
  if(!words.size || W < 2 || H < 2) return res;
  let entries = [...words.entries()].sort((a,b)=> b[1]-a[1]);   // häufigstes zuerst
  res.hidden = Math.max(0, entries.length - MAX_VISIBLE);       // Top-N-Kappung (kein stilles Droppen)
  entries = entries.slice(0, MAX_VISIBLE);
  res.attempted = entries.length;
  const counts = entries.map(e=> e[1]);
  const min = Math.min(...counts), max = Math.max(...counts);
  const base = sizeScale();
  const MAXS = base.MAXS * shrink;
  const MINS = Math.max(11, base.MINS * shrink);
  const cx0 = W/2, cy0 = H/2;
  const placed = [];
  for(const [word, c] of entries){
    const t = (max===min) ? 1 : (c-min)/(max-min);
    const size = MINS + Math.pow(t, 0.72) * (MAXS-MINS);
    measurer.font = '700 '+size+'px Poppins, system-ui, sans-serif';
    const suffix = c>=2 ? ' ·'+c : '';
    const textW = measurer.measureText(word+suffix).width;
    const textH = size*0.96;
    const vert = vertOf(word);
    const w = vert ? textH : textW;
    const h = vert ? textW : textH;
    let angle=0, radius=0, x=cx0, y=cy0, ok=false, iter=0;
    while(iter < 2600){
      x = cx0 + radius*Math.cos(angle);
      y = cy0 + radius*Math.sin(angle)*0.62;          // Ellipse: breitere Querformat-Wolke
      if(x-w/2 >= MARGIN && x+w/2 <= W-MARGIN && y-h/2 >= MARGIN && y+h/2 <= H-MARGIN){
        let hit=false;
        for(const p of placed){
          if(Math.abs(x-p.x) < (w+p.w)/2+GAP && Math.abs(y-p.y) < (h+p.h)/2+GAP){ hit=true; break; }
        }
        if(!hit){ ok=true; break; }
      }
      angle += 0.35; radius += 0.9; iter++;
    }
    if(!ok){
      if(placed.length===0){ x=cx0; y=cy0; }             // erstes Wort notfalls ins Zentrum
      else continue;                                     // passt (noch) nicht → Fit-Schleife schrumpft gleich
    }
    placed.push({x,y,w,h});
    res.layout.set(word, {x,y,size,vert});
    res.placed++;
  }
  return res;
}

/* --- Fit-Schleife: schrumpft die Schriftgrößen, bis ALLE Wörter passen,
   statt sie zu überlagern oder still zu verwerfen (wie Mentimeter). --- */
function computeLayoutFitted(){
  let shrink = 1, res = computeLayout(shrink), guard = 0;
  while(res.placed < res.attempted && shrink > 0.5 && guard++ < 6){
    shrink = Math.max(0.5, shrink - 0.11);
    res = computeLayout(shrink);
  }
  return res;
}

/* --- Rendering & Animation --- */
function render(pulseWord){
  empty.hidden = words.size > 0;
  const fit = computeLayoutFitted();
  const layout = fit.layout;
  updateOverflow(fit.hidden);

  // Wörter ausblenden, die aktuell nicht sichtbar sind
  // (entfernt ODER diese Runde aus Platzgründen nicht platziert → nie an alter Position hängen lassen)
  for(const [word, el] of els){
    if(!layout.has(word)){
      el.style.opacity = '0';
      el.style.transform = baseT(vertOf(word), .4);
      setTimeout(()=> el.remove(), 400);
      els.delete(word);
    }
  }

  for(const [word, info] of layout){
    let el = els.get(word);
    const isNew = !el;
    if(isNew){
      el = document.createElement('span');
      el.className = 'word entering';
      el.innerHTML = esc(word) + '<span class="cnt"></span>';
      cloud.appendChild(el);
      els.set(word, el);
    }
    const c = words.get(word);
    el.querySelector('.cnt').textContent = c>=2 ? '·'+c : '';
    el.style.color = colorFor(word);
    el.style.fontSize = info.size + 'px';
    el.style.left = info.x + 'px';
    el.style.top = info.y + 'px';
    if(isNew){
      el.style.opacity = '0';
      el.style.transform = baseT(info.vert, .35);
      requestAnimationFrame(()=> requestAnimationFrame(()=>{
        el.classList.remove('entering');
        el.style.opacity = '1';
        el.style.transform = baseT(info.vert, 1);
      }));
    } else {
      el.style.transform = baseT(info.vert, 1);
      if(word === pulseWord && el.animate){
        el.animate(
          [{transform: baseT(info.vert,1)}, {transform: baseT(info.vert,1.2)}, {transform: baseT(info.vert,1)}],
          {duration:480, easing:'cubic-bezier(.34,1.56,.64,1)'}
        );
      }
    }
  }
  updateCounters();
  updateSrList();
}

/* --- öffentliche Steuerung --- */
let participants = 0;
function addWord(text, fromReal){
  const disp = norm(text);
  if(!disp) return;
  const k = key(disp);
  let found = null;
  for(const w of words.keys()){ if(key(w)===k){ found=w; break; } }
  if(found){ words.set(found, words.get(found)+1); }
  else { words.set(disp, 1); found = disp; }
  if(fromReal){ participants++; }
  render(found);
}

/* ══════════════════ DEMO-SCHICHT (bei Integration ersetzen) ══════════════════ */
/* Seed — thematisch „Erinnerung / Verantwortung / Zukunft" */
[['Vertrauen',5],['Zukunft',7],['Erinnerung',9],['Verantwortung',6],['Dialog',4],
 ['Frieden',3],['Familie',3],['Hoffnung',2]].forEach(([w,n])=> words.set(w,n));
participants = 12;

const pool = ['Gerechtigkeit','Mut','Heimat','Freiheit','Zeitzeugen','Mahnung','Lernen','Wandel',
  'Gemeinschaft','Respekt','Geschichte','Bewahren','Stimme','Wahrheit','Fotos','Verlust','Frieden',
  'Vertrauen','Zukunft','Dialog','Hoffnung','Erinnerung','Menschlichkeit','Verantwortung','Aufarbeitung',
  'Solidarität','Würde','Nie wieder','Zusammenhalt','Familie'];

function counters(){
  return {
    cWords: words.size,
    cPeople: participants,
    cVotes: [...words.values()].reduce((a,b)=>a+b, 0)
  };
}
function animateTo(el, to){
  const from = parseInt(el.textContent,10) || 0;
  if(from===to){ el.textContent = to; return; }
  const step = from < to ? 1 : -1; let cur = from;
  const tick = ()=>{ cur += step; el.textContent = cur; if(cur!==to) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function updateCounters(){
  const c = counters();
  animateTo(document.getElementById('cWords'), c.cWords);
  animateTo(document.getElementById('cPeople'), c.cPeople);
  animateTo(document.getElementById('cVotes'), c.cVotes);
}
function updateSrList(){
  const top = [...words.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([w,n])=> w+' ('+n+')').join(', ');
  document.getElementById('srlist').textContent =
    words.size ? ('Häufigste Antworten: '+top) : 'Noch keine Antworten.';
}

/* "+N weitere" — ehrlicher Hinweis auf gekappte Top-N-Wörter (kein stilles Verwerfen) */
let overflowEl = null;
function updateOverflow(n){
  if(n > 0){
    if(!overflowEl){
      overflowEl = document.createElement('div');
      overflowEl.className = 'overflow-chip';
      document.querySelector('.cloud-wrap').appendChild(overflowEl);
    }
    overflowEl.textContent = '+' + n + ' weitere';
    overflowEl.style.display = 'block';
  } else if(overflowEl){
    overflowEl.style.display = 'none';
  }
}

/* simulierter Live-Feed */
let liveOn = true, liveTimer = null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(!liveOn) return;
  const delay = 900 + Math.random()*1600;
  liveTimer = setTimeout(()=>{
    addWord(pool[Math.floor(Math.random()*pool.length)], true);
    scheduleLive();
  }, delay);
}

/* Demo-Steuerung */
const liveBtn = document.getElementById('liveBtn'), liveLabel = document.getElementById('liveLabel');
liveBtn.addEventListener('click', ()=>{
  liveOn = !liveOn;
  liveBtn.classList.toggle('on', liveOn);
  liveBtn.setAttribute('aria-pressed', String(liveOn));
  liveLabel.textContent = liveOn ? 'Live' : 'Pausiert';
  scheduleLive();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  words.clear(); participants = 0; render();
});
document.getElementById('wform').addEventListener('submit', e=>{
  e.preventDefault();
  const inp = document.getElementById('wtext');
  if(inp.value.trim()){ addWord(inp.value, true); inp.value=''; }
  inp.focus();
});

/* Theme */
const themeBtn = document.getElementById('themeBtn'), docEl = document.documentElement;
themeBtn.addEventListener('click', ()=>{
  const dark = docEl.getAttribute('data-theme')==='dark';
  docEl.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? '◐ Dark' : '◑ Light';
  render();                     // Farben neu aus den Theme-Vars ziehen
  try{ localStorage.setItem('pulse-ww-theme', dark?'light':'dark'); }catch(_){}
});
try{ const s=localStorage.getItem('pulse-ww-theme'); if(s){ docEl.setAttribute('data-theme',s); themeBtn.textContent = s==='dark'?'◑ Light':'◐ Dark'; } }catch(_){}

/* QR-Platzhalter (deterministisches Muster — kein externer Dienst) */
(function drawQR(){
  const cv = document.getElementById('qr'), ctx = cv.getContext('2d'), N = 29;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,N,N);
  ctx.fillStyle = '#12151c';
  let seed = 8917123;
  const rnd = ()=> (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(rnd()>0.52) ctx.fillRect(x,y,1,1); }
  const finder = (ox,oy)=>{ ctx.fillStyle='#fff'; ctx.fillRect(ox,oy,7,7);
    ctx.fillStyle='#12151c'; ctx.fillRect(ox,oy,7,1); ctx.fillRect(ox,oy,1,7);
    ctx.fillRect(ox+6,oy,1,7); ctx.fillRect(ox,oy+6,7,1); ctx.fillRect(ox+2,oy+2,3,3); };
  finder(0,0); finder(22,0); finder(0,22);
})();

/* Start: Fonts abwarten (korrekte Vermessung), dann rendern + Live starten */
(document.fonts?.ready ?? Promise.resolve()).then(()=>{ render(); scheduleLive(); });
requestAnimationFrame(()=> render());   // erstes Layout, sobald Container gemessen ist

/* Resize: debounced → neu layouten */
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=> render(), 160); });
</script>
