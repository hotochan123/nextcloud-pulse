name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Bundle, Übersetzungen, Release-Archiv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Bundle bauen
        run: npm run build

      - name: Übersetzungen vollständig
        run: npm run l10n:check

      - name: info.xml gegen das App-Store-Schema prüfen
        run: |
          curl -sSL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      # Packt aus dem eben gebauten Stand ein Release-Archiv. Fängt fehlende
      # Dateien und versehentlich mitgepackte Quellen ab, bevor sie im Store
      # landen. Signiert wird nur lokal (braucht den privaten Schlüssel).
      - name: Release-Archiv testweise packen
        run: SKIP_BUILD=1 sh build/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-tarball
          path: build/pulse-*.tar.gz
          retention-days: 7

  php:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      # Die Tests fassen keine Datenbank an, brauchen aber die OCP-Klassen des
      # Servers — deshalb der Server-Checkout, in dem die App wie im echten
      # Leben unter apps/ liegt.
      - name: Nextcloud-Server auschecken
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: stable34
          submodules: true
          path: server

      - name: App auschecken
        uses: actions/checkout@v4
        with:
          path: server/apps/pulse

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer, xmlwriter, gd, zip
          tools: phpunit:11
          coverage: none

      - name: Syntaxprüfung
        working-directory: server/apps/pulse
        run: find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Unit-Tests
        working-directory: server/apps/pulse
        run: phpunit -c phpunit.xml
