name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not to a tag that can be moved;
# the comment names the release the commit belongs to.

jobs:
  frontend:
    name: Bundle, translations, release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Node version the committed bundles are built with: npm ci plus
      # npm run build reproduces them byte for byte with it (checked in a
      # node:22.18.0 container, in a different directory as well).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci

      - name: Build the bundle
        run: npm run build

      # A git clone runs the committed js/ bundles, not src/: they must be
      # exactly what the sources build to, or a change hidden in minified
      # code would go unreviewed (security review I4). After a change to
      # src/ or the dependencies, rebuild with this Node version and commit
      # js/ along with it. --stat keeps a mismatch readable.
      - name: Committed bundles match the sources
        run: |
          git diff --exit-code --stat -- js/
          test -z "$(git status --porcelain --untracked-files=all -- js/)"

      - name: Translations complete
        run: npm run l10n:check

      # The rules of the self-paced quiz (src/util/pace.js), the shared
      # helpers of src/util/format.js and the composer's contract per
      # question type (src/util/question-types.js), in plain Node. The
      # daylight-saving cases of pace.test need Europe/Berlin; without it
      # that test aborts with exit 2.
      - name: JS unit tests
        run: |
          TZ=Europe/Berlin node dev/unit/pace.test.mjs
          node dev/unit/format.test.mjs
          node dev/unit/question-types.test.mjs

      # The simulation and the screenshot harness only ever run against a
      # live instance, so CI at least parses them, the build scripts and the
      # shell scripts. node --check does not look inside the browser scripts
      # that shoot.mjs keeps in template literals.
      - name: Syntax of the dev, build and shell scripts
        run: |
          for f in dev/sim/*.mjs dev/unit/*.mjs dev/design-shots/shoot.mjs build/*.js; do
            node --check "$f"
          done
          for f in tests/run.sh dev/sim/run.sh dev/design-shots/run.sh build/package.sh build/certificate.sh; do
            sh -n "$f"
          done

      - name: Validate info.xml against the App Store schema
        run: |
          curl -sSL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      # Packs a release archive from the state just built. Catches missing
      # files and sources packed by mistake before they end up in the
      # store. Signing happens only locally (it needs the private key).
      # ALLOW_UNRELEASED=1: most pushes are not a release, so a missing
      # CHANGELOG section or version bump is only a warning here.
      - name: Pack a test release archive
        run: SKIP_BUILD=1 ALLOW_UNRELEASED=1 sh build/package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-tarball
          path: build/pulse-*.tar.gz
          retention-days: 7

  php:
    name: PHPUnit (${{ matrix.server }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # Nextcloud 35 is ahead of the app's max-version (34 in info.xml): a
    # failure there shows on its job but does not fail the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Nextcloud 34 with the oldest PHP it supports and with the PHP
        # production runs; Nextcloud 35 (PHP 8.3 to 8.5) with the latter.
        include:
          - server: stable34
            php: '8.2'
            experimental: false
          - server: stable34
            php: '8.5'
            experimental: false
          - server: stable35
            php: '8.5'
            experimental: true
    steps:
      # The tests don't touch a database, but they do need the server's OCP
      # classes — hence the server checkout, in which the app lives under
      # apps/ just like in real life.
      - name: Check out the Nextcloud server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server }}
          submodules: true
          path: server

      - name: Check out the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: server/apps/pulse

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # intl: the Spoofchecker tests in NameConfusableTest.
          extensions: tokenizer, xmlwriter, gd, zip, intl
          # php.ini-production switches this on, which strips the arguments
          # from every trace, and the two trace tests in
          # SensitiveParameterTest would skip.
          ini-values: zend.exception_ignore_args=Off
          tools: phpunit:11
          coverage: none

      # dev/ holds probe.php, which the screenshot harness runs on the
      # live instance.
      - name: Syntax check
        working-directory: server/apps/pulse
        run: find lib tests dev -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      # A skip is an environment gap (no intl, a PCRE without \p{DI}, traces
      # without arguments), and each one would hide a security test: here
      # it fails the job. tests/run.sh keeps PHPUnit's default.
      - name: Unit tests
        working-directory: server/apps/pulse
        run: phpunit -c phpunit.xml --fail-on-skipped
